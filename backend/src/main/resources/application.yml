spring:
  application:
    name: skillmirror-backend
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:skillmirror}?createDatabaseIfNotExist=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USER:skillmirror}
    password: ${MYSQL_PASSWORD:skillmirror}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    placeholders:
      text_type: TEXT
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 8MB
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info

skillmirror:
  security:
    jwt:
      # HS256 key, must be at least 32 bytes. Override in production via JWT_SECRET.
      secret: ${JWT_SECRET:skillmirror-dev-secret-change-me-in-production-0123456789abcdef}
      expiration-seconds: ${JWT_EXPIRATION_SECONDS:86400}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  ai:
    # mode: auto (live when AI_API_KEY is set, demo otherwise) | live | demo
    mode: ${AI_MODE:auto}
    base-url: ${AI_BASE_URL:https://api.openai.com/v1}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:gpt-4o-mini}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:45}
    max-tokens: ${AI_MAX_TOKENS:2500}
    daily-user-limit: ${AI_DAILY_USER_LIMIT:40}
    monthly-token-budget: ${AI_MONTHLY_TOKEN_BUDGET:2000000}
  upload:
    directory: ${UPLOAD_DIR:${user.dir}/uploads}
    max-bytes: ${UPLOAD_MAX_BYTES:5242880}
    allowed-extensions: pdf,txt,md,png,jpg,jpeg,zip,json,csv,docx
