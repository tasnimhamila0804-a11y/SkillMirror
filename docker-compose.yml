# SkillMirror — local MySQL for development and demonstrations.
# Usage:  docker compose up -d
# The backend then connects with MYSQL_USER / MYSQL_PASSWORD below.
services:
  mysql:
    image: mysql:8.4
    container_name: skillmirror-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: skillmirror
      MYSQL_USER: skillmirror
      MYSQL_PASSWORD: skillmirror
    ports:
      - "3306:3306"
    volumes:
      - skillmirror-mysql-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  skillmirror-mysql-data:
